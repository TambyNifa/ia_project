[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tena-ai"
version = "0.1.0"
description = "Système d'aide à l'analyse de rumeurs et d'informations potentiellement trompeuses."
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
